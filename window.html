<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hinged Shutter Demo</title>
    <style>
      /* Parent SVG container */
      #svg-wrapper {
        position: relative;
        width: 1297px;
        border: 1px solid #ccc;
        margin-bottom: 20px; /* space for slider below */
      }

      /* Static SVG background */
      #static-svg-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 1297px;
        height: 100%;
        z-index: 1;
      }

      /* Dynamic SVG on top */
      #dynamic-svg-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 1297px;
        height: 100%;
        z-index: 2;
        stroke-width: 2px;
      }
      #dynamic-svg-container,
      #static-svg-container {
        pointer-events: none;
      }
      /* Make slider visible and usable */
      #slider {
        width: 50%;
      }
    </style>
  </head>
  <body>
    <div id="svg-wrapper">
      <!-- Static SVG (background) -->
      <div id="static-svg-container">
        <img src="window.svg" alt="Window SVG" width="1297px" height="600" />
      </div>

      <!-- Dynamic SVG (on top) -->
      <div id="dynamic-svg-container">
        <svg viewBox="0 0 800 800" width="800" height="800">
          <!-- white-out section of drawing -->

          <polygon
            points="230,475 158,458 195,300 275,285"
            fill="white"
            stroke="white"
          />

          <!-- Hinged stub -->
          <g transform="translate(265,295)">
            <g id="stub" transform="rotate(-90)">
              <path
                d=" M -7.5 32.5 L 7.5 32.5 L 7.5 0 A 7.5 7.5 0 0 0 -7.5 0 Z"
                fill="white"
                stroke="black"
              />
              <!-- Shutter root -->
              <g id="root" transform="translate(7.5,32.5)">
                <!-- Panel 1 -->
                <g id="p1">
                  <rect
                    x="-15"
                    y="0"
                    width="15"
                    height="130"
                    fill="white"
                    stroke="black"
                  />

                  <!-- Panel 2 -->
                  <g transform="translate(-15,130)">
                    <g id="p2">
                      <rect
                        x="0"
                        y="0"
                        width="15"
                        height="115"
                        fill="white"
                        stroke="black"
                      />

                      <!-- Panel 3 -->
                      <g transform="translate(15,115)">
                        <g id="p3">
                          <rect
                            x="-15"
                            y="0"
                            width="15"
                            height="105"
                            fill="white"
                            stroke="black"
                          />
                        </g>
                      </g>
                    </g>
                  </g>
                </g>
              </g>
            </g>
          </g>
          <!-- Door -->
          <g id="door" transform="translate(230,475) rotate(-167)">
            <g id="door1">
              <polygon
                points="0,0 20,0 20,155 0,177"
                fill="white"
                stroke="black"
              />
            </g>
          </g>
        </svg>
      </div>
    </div>

    <!-- Slider below SVG -->
    <input type="range" id="slider" min="0" max="1" step="0.001" value="0" />

    <script>
      const stub = document.getElementById("stub");
      const p1 = document.getElementById("p1");
      const p2 = document.getElementById("p2");
      const p3 = document.getElementById("p3");
      const slider = document.getElementById("slider");

      function clamp01(x) {
        return Math.max(0, Math.min(1, x));
      }

      function segment(t, start, end) {
        return clamp01((t - start) / (end - start));
      }

      function mapRange(x, inMin, inMax, outMin, outMax) {
        const t = clamp01((x - inMin) / (inMax - inMin));
        return outMin + t * (outMax - outMin);
      }

      function doorAngle(t, maxAngle = 120) {
        if (t < 0.25) {
          // opening
          return mapRange(t, 0, 0.25, 0, maxAngle);
        } else if (t < 0.55) {
          // hold
          return maxAngle;
        } else {
          // closing
          return mapRange(t, 0.75, 1, maxAngle, 0);
        }
      }

      function update(t) {
        updatePanels(mapRange(t, 0.15, 0.85, 0, 1));
        let dA = doorAngle(t);
        door1.setAttribute("transform", `rotate(${dA})`);
      }

      function updatePanels(t) {
        range = 42;

        // from -90 to 55
        a0 = mapRange(t, 0, 1, -90, 55);

        a1 = mapRange(t, 0.666, 1, 0, -range);
        a2 = mapRange(t, 0, 0.333, 0, 180);
        a3 = mapRange(t, 0, 0.333, 0, -180);

        stub.setAttribute("transform", `rotate(${a0})`);
        p1.setAttribute("transform", `rotate(${a1})`);
        p2.setAttribute("transform", `rotate(${a2})`);
        p3.setAttribute("transform", `rotate(${a3})`);
      }

      // Update on slider move
      slider.addEventListener("input", (e) => {
        update(parseFloat(e.target.value));
      });

      // Optional auto-animation
      let t = 0;
      let dir = 1;
      function animate() {
        t += dir * 0.005;
        if (t > 1) {
          t = 1;
          dir = -1;
        }
        if (t < 0) {
          t = 0;
          dir = 1;
        }

        slider.value = t;
        update(t);
        requestAnimationFrame(animate);
      }

      // Uncomment to run auto-animation
      // animate();
    </script>
  </body>
</html>
